<!--
  Vorlage: Figuren (Liste, GhostWriter #53)

  Inline-Widget für den Chat. Wird über den Knopf „Figuren“ der
  Projektübersicht oder den Befehl „Figuren“ geöffnet (Aktion view.characters).
  Figuren sind Arbeitsgrundlage für Brainstorming und Ghostwriting und kommen
  nicht ins Buch.

  Aufbau:
  - Kopf: Masken-Symbol, „Figuren“, Zurück zur Übersicht
  - je Figur eine Zeile: Name, Rolle, Kurzbeschreibung, wo sie vorkommt;
    ein Klick öffnet „Figur bearbeiten“
  - Neue Figur: Name und Rolle, „Anlegen“

  Platzhalter (Text wird von gw.js HTML-maskiert):
  - {{PROJECT_TITLE_SHORT}}  project.title_short

  Wiederholung je Figur zwischen {{#CHARACTERS}} und {{/CHARACTERS}}:
  - {{C_ID}}      stabile ID, z. B. char-strolchi
  - {{C_NAME}}    Name
  - {{C_ROLE}}    Rolle deutsch, z. B. „Hauptfigur“
  - {{C_SHORT}}   ein Satz
  - {{C_USED}}    Abschnitte bzw. Teile, z. B. „1.1, 2.3, Prolog“; „–“ = noch nirgends

  Verhalten:
  - Klick auf eine Figur sendet view.character mit character_id.
  - „Anlegen“ sendet character.create mit name und role; danach gesperrt.

  Nachrichten: Klartextzeile plus Kurzform `gw:aktion schlüssel=wert` bzw. Block ```gw mit JSON, siehe templates/ui/BEFUELLUNG.md.
  Aktionen: view.character, character.create, view.project

  Voraussetzungen der Darstellungsumgebung: CSS-Variablen des Hosts
  (--surface-*, --text-*, --border-*, --bg-*, --gap-*, --pad-*, --radius),
  Tabler-Icons (ti-*) und eine globale Funktion sendPrompt(text).
-->
<h2 class="sr-only">Figuren des Buchs: öffnen oder neue Figur anlegen.</h2>
<style>
.gw-sq{width:40px;height:40px;flex:none;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-secondary);cursor:pointer;padding:0}
.gw-sq:hover{border-color:var(--border-strong);color:var(--text-primary)}
.gw-ch{display:flex;align-items:center;gap:var(--gap-md);padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);cursor:pointer;text-align:left;font:inherit;width:100%}
.gw-ch:hover{border-color:var(--border-strong)}
.gw-in{width:100%;box-sizing:border-box;padding:8px 11px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:14px}
.gw-btn{padding:8px 14px;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.gw-btn:disabled{opacity:0.4;cursor:default}
</style>
<div style="padding:1rem 0">
  <div id="gw-figuren" style="border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);padding:var(--pad-lg);display:flex;flex-direction:column;gap:var(--gap-md)">
    <div style="display:flex;align-items:flex-start;gap:var(--gap-md)">
      <div style="flex:1">
        <span style="font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;border:0.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)">{{PROJECT_TITLE_SHORT}}</span>
        <div style="font-size:20px;font-weight:500;display:flex;align-items:center;gap:8px;margin-top:4px"><i class="ti ti-masks-theater" style="color:var(--text-secondary)" aria-hidden="true"></i>Figuren</div>
      </div>
      <button type="button" class="gw-sq" id="gw-back" title="Zur Projektübersicht" aria-label="Zur Projektübersicht"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
    </div>
    <div data-gw-if="CHARACTERS" style="display:flex;flex-direction:column;gap:var(--gap-xs)">
      {{#CHARACTERS}}
      <button type="button" class="gw-ch" data-id="{{C_ID}}" data-name="{{C_NAME}}"><span style="flex:1;min-width:0"><span style="font-size:14px;font-weight:500">{{C_NAME}}</span> <span style="font-size:12px;color:var(--text-muted)">· {{C_ROLE}}</span><span style="display:block;font-size:12px;color:var(--text-secondary)">{{C_SHORT}}</span></span><span style="font-size:12px;color:var(--text-muted)" title="kommt vor in">{{C_USED}}</span><i class="ti ti-chevron-right" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i></button>
      {{/CHARACTERS}}
    </div>
    <div style="border-top:0.5px solid var(--border);padding-top:var(--pad-md);display:grid;grid-template-columns:2fr 1fr auto;gap:var(--gap-sm);align-items:end">
      <div><label for="gw-name" style="display:block;font-size:13px;font-weight:500;margin-bottom:4px">Neue Figur</label><input class="gw-in" id="gw-name" placeholder="Name"></div>
      <div><select class="gw-in" id="gw-role" aria-label="Rolle"><option value="main">Hauptfigur</option><option value="supporting">Nebenfigur</option><option value="minor">Randfigur</option></select></div>
      <button type="button" class="gw-btn" id="gw-add" disabled>Anlegen</button>
    </div>
    <div style="font-size:12px;color:var(--text-muted);line-height:1.5">Figuren sind Arbeitsgrundlage: Brainstorming, Ghostwriting und Faktencheck bekommen die Beschreibungen der Figuren, die im Abschnitt vorkommen. Ins Buch kommen sie nicht.</div>
  </div>
</div>
<script>
function gwSend(text,action,data){var d=GW.withHead(action,data||{}),k=Object.keys(d),short=k.every(function(x){var v=d[x];return typeof v==='number'||typeof v==='boolean'||(typeof v==='string'&&/^[^\s`]{1,80}$/.test(v));});sendPrompt(short?text+'\n\n`gw:'+action+k.map(function(x){return ' '+x+'='+d[x];}).join('')+'`':text+'\n\n```gw\n'+JSON.stringify(Object.assign({action:action},d))+'\n```');}
(function(){
  var box=document.getElementById('gw-figuren'),$=function(id){return document.getElementById(id);};
  box.querySelectorAll('.gw-ch[data-id]').forEach(function(r){r.addEventListener('click',function(){gwSend('Figur „'+r.dataset.name+'“ öffnen','view.character',{character_id:r.dataset.id});});});
  $('gw-back').addEventListener('click',function(){gwSend('Zur Projektübersicht','view.project',{});});
  var names=[];box.querySelectorAll('.gw-ch[data-name]').forEach(function(r){names.push(r.dataset.name.toLowerCase());});
  $('gw-name').addEventListener('input',function(){var v=$('gw-name').value.trim();$('gw-add').disabled=!v||names.indexOf(v.toLowerCase())>=0;$('gw-add').title=names.indexOf(v.toLowerCase())>=0?'Diese Figur gibt es schon':'';});
  $('gw-add').addEventListener('click',function(){
    var n=$('gw-name').value.trim();
    box.querySelectorAll('input,select,button').forEach(function(x){x.disabled=true;});box.style.opacity='0.6';
    gwSend('Figur „'+n+'“ anlegen','character.create',{name:n,role:$('gw-role').value});
  });
})();
</script>
