name: Sprachressourcen und Laufzeit prüfen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 build.py
      - run: git diff --exit-code -- dist/gw.js i18n/template-keys.json
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: node tests/runtime.test.cjs
      - run: node tests/forms-runtime.test.cjs
