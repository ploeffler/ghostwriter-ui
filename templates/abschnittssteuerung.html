<!--
  Vorlage: Abschnittssteuerung (Aktionspanel, siehe templates/ui/README.md)

  Inline-Widget für den Chat. Steuert für einen einzelnen Abschnitt,
  wie Recherche und Ghostwriting ausgeführt werden, und erlaubt das
  Sperren/Entsperren des Abschnitts.

  Aufbau:
  - Aktionskarte "Recherche"     – Optionen "Zeitgesteuert" | "Sofort"
  - Aktionskarte "Ghostwriting"  – Optionen "Zeitgesteuert" | "Sofort"
  - Steuerleiste rechts          – Umschaltknopf Sperren/Entsperren

  Platzhalter (vor der Ausgabe ersetzen, siehe templates/section.md):
  - {{SECTION_ID}}      stabile Abschnitts-ID
  - {{SECTION_NUMBER}}  sichtbare Nummer, z. B. 2.3
  - {{SECTION_TITLE}}   Titel des Abschnitts

  Verhalten:
  - "Zeitgesteuert" ist in v0.5 nicht verfügbar (workflow.yml,
    product_roadmap.v0_5: ai_runs_scheduled_queue ausgeschlossen). Die
    Option bleibt sichtbar, ist ausgegraut und trägt den Hinweis
    "nach v0.5". Zum Freischalten in der Option data-available="true" setzen.
  - Klick auf eine Option sendet per sendPrompt() eine Nachricht in den
    Chat und sperrt die Optionen der jeweiligen Karte.
  - Das Schloss sperrt bzw. entsperrt beide Karten nur im Widget; es
    sendet keine Nachricht.
  - Ab 560 px Breite und darunter rutscht "Ghostwriting" unter
    "Recherche", die Steuerleiste bleibt rechts.

  Nachrichten: Klartextzeile plus Block ```gw mit JSON, siehe templates/ui/BEFUELLUNG.md.
  Aktionen: run.start {section_id, task: research|writing, mode: immediate|scheduled}

  Voraussetzungen der Darstellungsumgebung: CSS-Variablen des Hosts
  (--surface-*, --text-*, --border-*, --bg-*, --gap-*, --pad-*, --radius),
  Tabler-Icons (ti-*) und eine globale Funktion sendPrompt(text).
-->
<h2 class="sr-only">Abschnittssteuerung für Abschnitt {{SECTION_NUMBER}} {{SECTION_TITLE}}: Recherche und Ghostwriting zeitgesteuert oder sofort ausführen, Abschnitt sperren oder entsperren.</h2>
<style>
.gw-wrap{display:grid;grid-template-columns:1fr 1fr 56px;gap:var(--gap-md);padding:1rem 0}
.gw-card{border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);padding:var(--pad-md);display:flex;flex-direction:column;gap:var(--gap-sm);min-width:0}
.gw-head{display:flex;align-items:center;gap:var(--gap-sm);margin-bottom:4px}
.gw-ico{width:40px;height:40px;flex:none;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-secondary)}
.gw-opt{display:flex;align-items:center;gap:var(--gap-sm);text-align:left;padding:10px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);cursor:pointer;font:inherit;width:100%}
.gw-opt:hover:not(:disabled){border-color:var(--border-stronger)}
.gw-opt:disabled{cursor:default}
.gw-opt.sel{border-color:var(--border-accent);background:var(--bg-accent)}
.gw-lockcard{border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);display:flex;align-items:flex-start;justify-content:center;padding:var(--pad-md) 0}
.gw-lock{width:40px;height:40px;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.gw-lock:hover{border-color:var(--border-strong)}
.gw-lock.on{border-color:var(--border-warning);background:var(--bg-warning);color:var(--text-warning)}
.gw-wrap.locked .gw-card{opacity:0.5}
@media (max-width:560px){.gw-wrap{grid-template-columns:1fr 56px}.gw-card[data-task="Ghostwriting"]{grid-row:2}.gw-lockcard{grid-row:1/3;grid-column:2}}
.gw-opt[data-available="false"]{opacity:0.45;cursor:default}
.gw-later{font-size:11px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
</style>
<div class="gw-wrap" id="gw-abschnittssteuerung" data-section-id="{{SECTION_ID}}" data-section-number="{{SECTION_NUMBER}}" data-section-title="{{SECTION_TITLE}}">
  <div class="gw-card" data-task="Recherche">
    <div class="gw-head">
      <div class="gw-ico"><i class="ti ti-search" aria-hidden="true"></i></div>
      <div><div style="font-size:16px;font-weight:500">Recherche</div><div style="font-size:13px;color:var(--text-secondary)">Quellen finden und auswerten</div></div>
    </div>
    <button type="button" class="gw-opt" data-mode="zeitgesteuert" data-available="false"><i class="ti ti-clock" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i><span><span style="font-size:14px;font-weight:500">Zeitgesteuert</span><br><span style="font-size:12px;color:var(--text-secondary)">Job in der Cloud-Warteschlange</span></span></button>
    <button type="button" class="gw-opt" data-mode="sofort"><i class="ti ti-bolt" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i><span><span style="font-size:14px;font-weight:500">Sofort</span><br><span style="font-size:12px;color:var(--text-secondary)">Direkt hier im Chat</span></span></button>
  </div>
  <div class="gw-card" data-task="Ghostwriting">
    <div class="gw-head">
      <div class="gw-ico"><i class="ti ti-feather" aria-hidden="true"></i></div>
      <div><div style="font-size:16px;font-weight:500">Ghostwriting</div><div style="font-size:13px;color:var(--text-secondary)">Automated Content Generation (ACG)</div></div>
    </div>
    <button type="button" class="gw-opt" data-mode="zeitgesteuert" data-available="false"><i class="ti ti-clock" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i><span><span style="font-size:14px;font-weight:500">Zeitgesteuert</span><br><span style="font-size:12px;color:var(--text-secondary)">Job in der Cloud-Warteschlange</span></span></button>
    <button type="button" class="gw-opt" data-mode="sofort"><i class="ti ti-bolt" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i><span><span style="font-size:14px;font-weight:500">Sofort</span><br><span style="font-size:12px;color:var(--text-secondary)">Direkt hier im Chat</span></span></button>
  </div>
  <div class="gw-lockcard">
    <button type="button" class="gw-lock" aria-pressed="false" aria-label="Abschnitt sperren" title="Abschnitt sperren"><i class="ti ti-lock-open" aria-hidden="true"></i></button>
  </div>
</div>
<script>
function gwSend(text,action,data){var p=Object.assign({action:action},data||{});sendPrompt(text+'\n\n```gw\n'+JSON.stringify(p)+'\n```');}
(function(){
  var wrap=document.getElementById('gw-abschnittssteuerung');
  var ref='Abschnitt '+wrap.dataset.sectionNumber+' „'+wrap.dataset.sectionTitle+'“ (ID '+wrap.dataset.sectionId+')';
  var texts={
    'Recherche|zeitgesteuert':'Recherche für '+ref+' zeitgesteuert als Job in die Cloud-Warteschlange übergeben',
    'Recherche|sofort':ref+' jetzt sofort hier im Chat recherchieren',
    'Ghostwriting|zeitgesteuert':'Ghostwriting für '+ref+' zeitgesteuert als Job in die Cloud-Warteschlange übergeben',
    'Ghostwriting|sofort':ref+' jetzt sofort hier im Chat schreiben (Ghostwriting)'
  };
  wrap.querySelectorAll('.gw-opt[data-available="false"]').forEach(function(x){
    x.disabled=true;x.title='Nicht verfügbar in v0.5';
    var s=document.createElement('span');s.className='gw-later';s.textContent='nach v0.5';x.appendChild(s);
  });
  var lock=wrap.querySelector('.gw-lock'),ico=lock.querySelector('i'),locked=false;
  function refresh(){
    wrap.querySelectorAll('.gw-card').forEach(function(card){
      var done=card.dataset.done==='1';
      card.querySelectorAll('.gw-opt').forEach(function(x){x.disabled=locked||done||x.dataset.available==='false';});
    });
  }
  wrap.querySelectorAll('.gw-card').forEach(function(card){
    var opts=card.querySelectorAll('.gw-opt');
    opts.forEach(function(b){
      b.addEventListener('click',function(){
        if(locked)return;
        card.dataset.done='1';
        opts.forEach(function(x){if(x===b){x.classList.add('sel');}else{x.style.opacity='0.45';}});
        refresh();
        gwSend(texts[card.dataset.task+'|'+b.dataset.mode],'run.start',{section_id:wrap.dataset.sectionId,task:card.dataset.task==='Recherche'?'research':'writing',mode:b.dataset.mode==='sofort'?'immediate':'scheduled'});
      });
    });
  });
  lock.addEventListener('click',function(){
    locked=!locked;
    wrap.classList.toggle('locked',locked);
    lock.classList.toggle('on',locked);
    lock.setAttribute('aria-pressed',String(locked));
    var lbl=locked?'Abschnitt entsperren':'Abschnitt sperren';
    lock.setAttribute('aria-label',lbl);lock.title=lbl;
    ico.className=locked?'ti ti-lock':'ti ti-lock-open';
    refresh();
  });
})();
</script>
