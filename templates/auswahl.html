<!--
  Vorlage: Auswahl (Auswahlkarten, siehe templates/ui/README.md in GhostWriter, Issue #81)

  Inline-Widget für den Chat. Stellt 1–4 Fragen des Einstiegsdialogs (Wizard)
  oder eines anderen geführten Dialogs als anklickbare Karten dar, statt sie als
  Fließtext zu fragen. Jede Frage hat 2–6 Antworten, eine davon kann als
  „Empfohlen“ markiert sein. Zu jeder Frage gibt es zusätzlich ein Feld
  „Andere Antwort“ für freien Text.

  Aufbau:
  - Kopf: Symbol, Titel (z. B. "Neues Buch · Schritt 3 von 13"), Untertitel
  - je Frage: kurzes Etikett (Chip), Fragetext, Antwortkarten (Titel und eine
    Zeile Erklärung, Kennzeichen „Empfohlen“), Feld „Andere Antwort“;
    Einfachauswahl (Karte wählt, ein zweiter Klick hebt auf) oder
    Mehrfachauswahl (Häkchen)
  - Fußzeile: Hinweis, Knopf „Überspringen“ (nur wenn SKIPPABLE) und „Weiter“
  „Weiter“ verlangt zu jeder Frage eine Antwort (Karte oder eigener Text).

  Platzhalter (vor der Ausgabe ersetzen; Text HTML-maskiert):
  - {{STEP}}            Kennung des Schritts, geht unverändert zurück (z. B. "wizard.3" oder "project.genre")
  - {{TITLE}}           Kopfzeile, z. B. "Neues Buch · Schritt 3 von 13"
  - {{SUBTITLE}}        eine Zeile darunter; leer = entfällt
  - {{NOTE}}            Hinweis in der Fußzeile, z. B. "Alles lässt sich später in den Projekteinstellungen ändern."
  - {{SKIPPABLE}}       nicht leer = Knopf „Überspringen“ anzeigen
  Wiederholung zwischen {{#QUESTIONS}} und {{/QUESTIONS}} (1–4 Einträge):
  - {{Q_INDEX}}         1, 2, 3, 4 (verbindet Frage und Antworten)
  - {{Q_KEY}}           Feldname der Antwort, z. B. "genre"
  - {{Q_HEADER}}        kurzes Etikett, höchstens 12 Zeichen, z. B. "Genre"
  - {{Q_TEXT}}          Fragetext
  - {{Q_MULTI}}         "1" = Mehrfachauswahl, sonst leer
  Wiederholung zwischen {{#OPTIONS}} und {{/OPTIONS}} (flach, alle Antworten aller Fragen in Reihenfolge;
  gw.js kennt keine verschachtelten Blöcke, das Skript ordnet sie über OPT_Q der Frage zu):
  - {{OPT_Q}}           Q_INDEX der Frage
  - {{OPT_VALUE}}       Wert, der zurückgeht, z. B. "sachbuch"
  - {{OPT_LABEL}}       Titel der Karte, 1–5 Wörter
  - {{OPT_DESC}}        eine Zeile Erklärung; leer = entfällt
  - {{OPT_RECOMMENDED}} "1" = Kennzeichen „Empfohlen“ (höchstens eine je Frage), sonst leer
  - {{OPT_SELECTED}}    "1" = vorausgewählt (z. B. bisheriger Wert), sonst leer

  Nachrichten: Klartextzeile plus Kurzform `gw:aktion schlüssel=wert` bzw. Block ```gw mit JSON, siehe templates/ui/BEFUELLUNG.md.
  Aktionen: wizard.answer {step, answers: {Q_KEY: Wert | [Werte] | {other: Text}}}, wizard.skip {step}

  Voraussetzungen der Darstellungsumgebung: CSS-Variablen des Hosts
  (--surface-*, --text-*, --border-*, --bg-*, --gap-*, --pad-*, --radius),
  Tabler-Icons (ti-*) und eine globale Funktion sendPrompt(text).
-->
<h2 class="sr-only">{{TITLE}}: Fragen mit Antwortkarten; zu jeder Frage eine Karte wählen oder eine eigene Antwort eingeben.</h2>
<style>
.gw-a .q{display:flex;flex-direction:column;gap:8px}
.gw-a .q+.q{border-top:0.5px solid var(--border);padding-top:var(--pad-md)}
.gw-a .chip{align-self:flex-start;font-size:11px;font-weight:500;letter-spacing:0.03em;text-transform:uppercase;color:var(--text-secondary);background:var(--surface-2);border:0.5px solid var(--border);border-radius:999px;padding:2px 8px}
.gw-a .qt{font-size:15px;font-weight:500;line-height:1.4}
.gw-a .qh{font-size:12px;color:var(--text-muted)}
.gw-a .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.gw-a .opt{position:relative;text-align:left;padding:10px 12px 10px 36px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:56px}
.gw-a .opt:hover{border-color:var(--border-accent)}
.gw-a .opt:focus-visible{outline:2px solid var(--border-accent);outline-offset:1px}
.gw-a .opt[aria-checked="true"],.gw-a .opt[aria-pressed="true"]{border-color:var(--text-accent);background:var(--bg-accent,var(--surface-2));box-shadow:inset 0 0 0 1px var(--text-accent)}
.gw-a .opt .mk{position:absolute;left:12px;top:12px;width:14px;height:14px;border:1.5px solid var(--border-strong);border-radius:50%;box-sizing:border-box}
.gw-a .opt.multi .mk{border-radius:3px}
.gw-a .opt[aria-checked="true"] .mk,.gw-a .opt[aria-pressed="true"] .mk{border-color:var(--text-accent);background:var(--text-accent);box-shadow:inset 0 0 0 2px var(--surface-2)}
.gw-a .opt .l{font-size:14px;font-weight:500;line-height:1.3}
.gw-a .opt .d{font-size:12px;color:var(--text-secondary);line-height:1.4}
.gw-a .opt .d:empty{display:none}
.gw-a .rec{display:none;align-self:flex-start;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-accent);margin-top:3px}
.gw-a .opt.is-rec .rec{display:inline}
.gw-a .other{width:100%;box-sizing:border-box;padding:8px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:14px}
.gw-a .other:focus{outline:none;border-color:var(--border-accent)}
.gw-err{font-size:13px;color:var(--text-danger)}
.gw-btn{padding:9px 16px;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.gw-btn:disabled{opacity:0.4;cursor:default}
</style>
<div style="padding:1rem 0">
  <form class="gw-a" id="gw-auswahl" data-step="{{STEP}}" novalidate style="border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);padding:var(--pad-lg);display:flex;flex-direction:column;gap:var(--gap-md)">
    <div>
      <div style="display:flex;align-items:center;gap:var(--gap-sm)">
        <i class="ti ti-list-check" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i>
        <span style="font-size:16px;font-weight:500">{{TITLE}}</span>
      </div>
      <div data-gw-if="SUBTITLE" style="font-size:14px;color:var(--text-secondary);margin-top:2px">{{SUBTITLE}}</div>
    </div>

    {{#QUESTIONS}}
    <div class="q" data-q="{{Q_INDEX}}" data-key="{{Q_KEY}}" data-multi="{{Q_MULTI}}">
      <span class="chip">{{Q_HEADER}}</span>
      <div class="qt" id="gw-qt-{{Q_INDEX}}">{{Q_TEXT}}</div>
      <div class="qh"></div>
      <div class="opts" aria-labelledby="gw-qt-{{Q_INDEX}}"></div>
      <input class="other" type="text" placeholder="Andere Antwort (optional)" aria-label="Andere Antwort">
      <div class="gw-err" hidden>Bitte eine Antwort wählen oder eingeben.</div>
    </div>
    {{/QUESTIONS}}

    <div id="gw-optpool" hidden>
      {{#OPTIONS}}
      <button type="button" class="opt" data-q="{{OPT_Q}}" data-value="{{OPT_VALUE}}" data-rec="{{OPT_RECOMMENDED}}" data-sel="{{OPT_SELECTED}}"><span class="mk" aria-hidden="true"></span><span class="l">{{OPT_LABEL}}</span><span class="d">{{OPT_DESC}}</span><span class="rec">Empfohlen</span></button>
      {{/OPTIONS}}
    </div>

    <div style="border-top:0.5px solid var(--border);padding-top:var(--pad-md);display:flex;align-items:center;gap:var(--gap-md);flex-wrap:wrap">
      <div style="flex:1;min-width:200px;font-size:12px;color:var(--text-muted);line-height:1.5">{{NOTE}}</div>
      <button type="button" class="gw-btn" id="gw-skip" data-gw-if="SKIPPABLE" style="border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary)">Überspringen</button>
      <button type="button" class="gw-btn" id="gw-next" style="border:none;background:var(--text-primary);color:var(--surface-1);display:inline-flex;align-items:center;gap:6px">Weiter<i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  </form>
</div>
<script>
function gwSend(text,action,data){var d=GW.withHead(action,data||{}),k=Object.keys(d),short=k.every(function(x){var v=d[x];return typeof v==='number'||typeof v==='boolean'||(typeof v==='string'&&/^[^\s`]{1,80}$/.test(v));});sendPrompt(short?text+'\n\n`gw:'+action+k.map(function(x){return ' '+x+'='+d[x];}).join('')+'`':text+'\n\n```gw\n'+JSON.stringify(Object.assign({action:action},d))+'\n```');}
(function(){
  var f=document.getElementById('gw-auswahl'),step=f.dataset.step;
  var qs=[].slice.call(f.querySelectorAll('.q'));
  var pool=document.getElementById('gw-optpool');
  // Antworten aus dem flachen Block den Fragen zuordnen
  [].slice.call(pool.querySelectorAll('.opt')).forEach(function(o){
    var q=f.querySelector('.q[data-q="'+o.dataset.q+'"]');
    if(!q)return;
    var multi=q.dataset.multi==='1';
    var d=o.querySelector('.d');if(/^\{\{/.test(d.textContent))d.textContent='';   // fehlendes OPT_DESC
    if(o.dataset.rec==='1')o.classList.add('is-rec');
    if(multi){o.classList.add('multi');o.setAttribute('aria-pressed',o.dataset.sel==='1'?'true':'false');}
    else{o.setAttribute('role','radio');o.setAttribute('aria-checked',o.dataset.sel==='1'?'true':'false');}
    q.querySelector('.opts').appendChild(o);
  });
  pool.remove();
  qs.forEach(function(q){
    var multi=q.dataset.multi==='1',opts=q.querySelector('.opts'),other=q.querySelector('.other'),err=q.querySelector('.gw-err');
    q.querySelector('.qh').textContent=multi?'Mehrere Antworten möglich':'Eine Antwort wählen';
    if(!multi)opts.setAttribute('role','radiogroup');
    opts.addEventListener('click',function(e){
      var o=e.target.closest('.opt');if(!o)return;
      err.hidden=true;
      if(multi){o.setAttribute('aria-pressed',o.getAttribute('aria-pressed')==='true'?'false':'true');return;}
      var on=o.getAttribute('aria-checked')==='true';
      opts.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-checked','false');});
      if(!on){o.setAttribute('aria-checked','true');other.value='';}
    });
    other.addEventListener('input',function(){
      err.hidden=true;
      if(!multi&&other.value.trim())opts.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-checked','false');});
    });
  });
  function chosen(q){return [].filter.call(q.querySelectorAll('.opt'),function(o){return o.getAttribute('aria-checked')==='true'||o.getAttribute('aria-pressed')==='true';});}
  function lock(){f.querySelectorAll('input,button').forEach(function(x){x.disabled=true;});f.style.opacity='0.6';}
  document.getElementById('gw-next').addEventListener('click',function(){
    var answers={},lines=[],bad=null;
    qs.forEach(function(q){
      var multi=q.dataset.multi==='1',sel=chosen(q),txt=q.querySelector('.other').value.trim(),key=q.dataset.key,v,shown;
      if(!sel.length&&!txt){q.querySelector('.gw-err').hidden=false;bad=bad||q;return;}
      if(multi){v=sel.map(function(o){return o.dataset.value;});if(txt)v.push({other:txt});shown=sel.map(function(o){return o.querySelector('.l').textContent;}).concat(txt?[txt]:[]).join(', ');}
      else if(sel.length){v=sel[0].dataset.value;shown=sel[0].querySelector('.l').textContent;}
      else{v={other:txt};shown=txt;}
      answers[key]=v;
      lines.push(q.querySelector('.chip').textContent+': '+shown);
    });
    if(bad){(bad.querySelector('.opt')||bad.querySelector('.other')).focus();return;}
    lock();
    gwSend(lines.join('\n'),'wizard.answer',{step:step,answers:answers});
  });
  var sk=document.getElementById('gw-skip');
  if(sk)sk.addEventListener('click',function(){lock();gwSend('Diesen Schritt überspringen','wizard.skip',{step:step});});
})();
</script>
