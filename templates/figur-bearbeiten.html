<!--
  Vorlage: Figur bearbeiten (Formular, GhostWriter #53)

  Inline-Widget für den Chat (Aktion view.character mit character_id).

  Aufbau:
  - Kopf: Kurztitel, Name; Symbolleiste: alle Figuren, Projektübersicht
  - Name, Rolle, Kurzbeschreibung (ein Satz)
  - Alter, Aussehen, Eigenschaften (kommagetrennt), Sprechweise
  - Bildbeschreibung (für Illustrationen, #54)
  - Beziehungen: je Zeile andere Figur und Art („Besitzer“, „Schwester“ …),
    hinzufügen und entfernen
  - Beschreibung und Notizen (Markdown)
  - wo die Figur vorkommt (nur Anzeige)
  - Verwerfen und Speichern

  Platzhalter (Text wird von gw.js HTML-maskiert):
  - {{PROJECT_TITLE_SHORT}}       project.title_short
  - {{CHARACTER_ID}}              stabile ID (char-…)
  - {{CHARACTER_NAME}}, {{CHARACTER_ROLE}}  name, role (main | supporting | minor)
  - {{CHARACTER_SHORT}}, {{CHARACTER_AGE}}, {{CHARACTER_APPEARANCE}}, {{CHARACTER_VOICE}}, {{CHARACTER_VISUAL}}
                                   Felder aus dem Kopf der Figurendatei
  - {{CHARACTER_TRAITS}}          Eigenschaften, kommagetrennt
  - {{CHARACTER_DESCRIPTION}}, {{CHARACTER_NOTES}}  „## Beschreibung“ und „## Notizen“
  - {{CHARACTER_USED}}            z. B. „1.1, 2.3“ oder „noch nirgends“
  - {{CHARACTER_SOURCE}}          Band einer Serie (GhostWriter #116): series (Figur der Serie) | copy | copy_diff
                                   (Kopie gleich bzw. abweichend) | own (nur in diesem Buch); ohne Serie leer
  - {{CHARACTER_SOURCE_TEXT}}     z. B. „aus der Serie“
  - {{SERIES_ID}}, {{SERIES_TITLE}}  Serie des Buchs; leer ohne Serie

  Wiederholung je Beziehung zwischen {{#RELATIONS}} und {{/RELATIONS}}:
  - {{R_TO}}, {{R_NAME}}, {{R_KIND}}  ID und Name der anderen Figur, Art der Beziehung
  Wiederholung je anderer Figur zwischen {{#OTHERS}} und {{/OTHERS}} (Auswahl für Beziehungen):
  - {{O_ID}}, {{O_NAME}}

  Verhalten:
  - Speichern sendet character.update mit allen Feldern (traits als Liste,
    relations als Liste {to, kind}); leere Felder entfernen den Eintrag.
    Danach ist das Formular gesperrt.
  - Figur der Serie (CHARACTER_SOURCE series): Speichern sendet
    character.series.update (mit series_id; gilt für alle Bände ohne eigene
    Kopie); „Kopie nur für dieses Buch“ sendet character.detach.
  - Kopie (copy, copy_diff): „An Serie angleichen“ (character.align),
    „In die Serie übernehmen“ (character.adopt); eigene Figur eines Bandes (own):
    „In die Serie übernehmen“ (character.adopt).

  Nachrichten: Klartextzeile plus Kurzform `gw:aktion schlüssel=wert` bzw. Block ```gw mit JSON, siehe templates/ui/BEFUELLUNG.md.
  Aktionen: character.update, character.series.update, character.detach, character.align, character.adopt, view.characters, view.project, form.cancel

  Voraussetzungen der Darstellungsumgebung: CSS-Variablen des Hosts
  (--surface-*, --text-*, --border-*, --bg-*, --gap-*, --pad-*, --radius,
  --font-mono), Tabler-Icons (ti-*) und eine globale Funktion sendPrompt(text).
-->
<h2 class="sr-only">{{t:ui.edit_character}}</h2>
<style>
.gw-sq{width:40px;height:40px;flex:none;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-secondary);cursor:pointer;padding:0}
.gw-sq:hover{border-color:var(--border-strong);color:var(--text-primary)}
.gw-lbl{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.gw-hint{font-size:12px;color:var(--text-muted);font-weight:400}
.gw-in{width:100%;box-sizing:border-box;padding:8px 11px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:14px;line-height:1.5;resize:vertical}
.gw-in:focus{outline:none;border-color:var(--border-accent)}
.gw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--gap-md)}
.gw-rel{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.gw-x{width:32px;height:32px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text-secondary);cursor:pointer;padding:0}
.gw-mini{padding:4px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font:inherit;font-size:13px;cursor:pointer;justify-self:start}
.gw-btn{padding:9px 16px;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.gw-btn:disabled{opacity:0.4;cursor:default}
</style>
<div style="padding:1rem 0">
  <div id="gw-figur" data-id="{{CHARACTER_ID}}" data-role="{{CHARACTER_ROLE}}" data-source="{{CHARACTER_SOURCE}}" data-series="{{SERIES_ID}}" data-series-title="{{SERIES_TITLE}}" style="border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);padding:var(--pad-lg);display:flex;flex-direction:column;gap:var(--gap-md)">
    <div style="display:flex;align-items:flex-start;gap:var(--gap-md)">
      <div style="flex:1">
        <span style="font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;border:0.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)">{{PROJECT_TITLE_SHORT}}</span>
        <div style="font-size:20px;font-weight:500;margin-top:4px">{{CHARACTER_NAME}}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">{{t:ui.appears_in}}</div>
      </div>
      <button type="button" class="gw-sq" data-a="view.characters" data-p="{{t:ui.all_characters}}" title="{{t:ui.all_characters}}" aria-label="{{t:ui.all_characters}}"><i class="ti ti-masks-theater" aria-hidden="true"></i></button>
      <button type="button" class="gw-sq" data-a="view.project" data-p="{{t:ui.project_overview}}" title="{{t:ui.project_overview}}" aria-label="{{t:ui.project_overview}}"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
    </div>
    <div id="gw-ser" data-gw-if="CHARACTER_SOURCE" style="display:flex;align-items:center;gap:var(--gap-sm);flex-wrap:wrap;padding:8px 10px;border:0.5px solid var(--border-accent);border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);font-size:13px">
      <i class="ti ti-stack-2" aria-hidden="true"></i><span style="flex:1;min-width:180px"><span id="gw-ser-text">{{CHARACTER_SOURCE_TEXT}}</span> {{t:ui.series}}</span>
      <button type="button" class="gw-btn gw-sact" data-act="character.detach" data-t="{{t:ui.series_action_2}}" style="padding:5px 10px;font-size:13px;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)">{{t:ui.copy_for_this_book_only}}</button>
      <button type="button" class="gw-btn gw-sact" data-act="character.align" data-t="{{t:ui.series_action_3}}" style="padding:5px 10px;font-size:13px;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)">{{t:ui.match_series_version}}</button>
      <button type="button" class="gw-btn gw-sact" data-act="character.adopt" data-t="{{t:ui.apply_to_series}}" style="padding:5px 10px;font-size:13px;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)">{{t:ui.apply_to_series}}</button>
    </div>
    <div class="gw-grid">
      <div><label class="gw-lbl" for="f-name">{{t:ui.name}}</label><input class="gw-in" id="f-name" value="{{CHARACTER_NAME}}"></div>
      <div><label class="gw-lbl" for="f-role">{{t:ui.role}}</label><select class="gw-in" id="f-role"><option value="main">{{t:ui.main_character}}</option><option value="supporting">{{t:ui.supporting_character}}</option><option value="minor">{{t:ui.minor_character}}</option></select></div>
      <div><label class="gw-lbl" for="f-age">{{t:ui.age}}</label><input class="gw-in" id="f-age" value="{{CHARACTER_AGE}}"></div>
    </div>
    <div><label class="gw-lbl" for="f-short">{{t:ui.brief_description}} <span class="gw-hint">{{t:ui.one_sentence_who_is_this_character}}</span></label><input class="gw-in" id="f-short" value="{{CHARACTER_SHORT}}"></div>
    <div class="gw-grid">
      <div><label class="gw-lbl" for="f-appearance">{{t:ui.appearance}}</label><textarea class="gw-in" id="f-appearance" rows="2">{{CHARACTER_APPEARANCE}}</textarea></div>
      <div><label class="gw-lbl" for="f-voice">{{t:ui.speech}}</label><textarea class="gw-in" id="f-voice" rows="2">{{CHARACTER_VOICE}}</textarea></div>
    </div>
    <div><label class="gw-lbl" for="f-traits">{{t:ui.traits}} <span class="gw-hint">{{t:ui.comma_separated}}</span></label><input class="gw-in" id="f-traits" value="{{CHARACTER_TRAITS}}"></div>
    <div><label class="gw-lbl" for="f-visual">{{t:ui.image_description}} <span class="gw-hint">{{t:ui.for_illustrations_consistent_features}}</span></label><textarea class="gw-in" id="f-visual" rows="2">{{CHARACTER_VISUAL}}</textarea></div>
    <div>
      <div class="gw-lbl">{{t:ui.relationships}} <span class="gw-hint">{{t:ui.type_e_g_owner_grandpa_owns_strolchi}}</span></div>
      <div id="gw-rels" style="display:flex;flex-direction:column;gap:6px">
        {{#RELATIONS}}
        <div class="gw-rel" data-to="{{R_TO}}"><input class="gw-in gw-k" value="{{R_KIND}}" aria-label="{{t:ui.relationship_type}}"><select class="gw-in gw-t" aria-label="{{t:ui.character}}"></select><button type="button" class="gw-x" title="{{t:ui.remove}}" aria-label="{{t:ui.remove}}"><i class="ti ti-x" aria-hidden="true"></i></button></div>
        {{/RELATIONS}}
      </div>
      <select id="gw-others" hidden>
        {{#OTHERS}}
        <option value="{{O_ID}}">{{O_NAME}}</option>
        {{/OTHERS}}
      </select>
      <button type="button" class="gw-mini" id="gw-addrel" style="margin-top:6px"><i class="ti ti-plus" aria-hidden="true"></i> {{t:ui.relationship}}</button>
    </div>
    <div><label class="gw-lbl" for="f-desc">{{t:ui.description}} <span class="gw-hint">{{t:ui.markdown_working_reference_excluded_from_the_book}}</span></label><textarea class="gw-in" id="f-desc" rows="5" style="font-family:var(--font-mono);font-size:13px">{{CHARACTER_DESCRIPTION}}</textarea></div>
    <div><label class="gw-lbl" for="f-notes">{{t:ui.notes_2}}</label><textarea class="gw-in" id="f-notes" rows="3">{{CHARACTER_NOTES}}</textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:var(--gap-sm);border-top:0.5px solid var(--border);padding-top:var(--pad-md)">
      <button type="button" class="gw-btn" id="gw-cancel" style="border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary)">{{t:ui.discard}}</button>
      <button type="button" class="gw-btn" id="gw-save" style="border:0.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)">{{t:ui.save}}</button>
    </div>
  </div>
</div>
<script>
function gwSend(text,action,data){var d=GW.withHead(action,data||{}),k=Object.keys(d),short=k.every(function(x){var v=d[x];return typeof v==='number'||typeof v==='boolean'||(typeof v==='string'&&/^[^\s`]{1,80}$/.test(v));});sendPrompt(short?text+'\n\n`gw:'+action+k.map(function(x){return ' '+x+'='+d[x];}).join('')+'`':text+'\n\n```gw\n'+JSON.stringify(Object.assign({action:action},d))+'\n```');}
(function(){
  var box=document.getElementById('gw-figur'),d=box.dataset,$=function(id){return document.getElementById(id);};
  $('f-role').value=d.role||'main';
  box.querySelectorAll('.gw-sq[data-a]').forEach(function(b){b.addEventListener('click',function(){gwSend(b.dataset.p,b.dataset.a,{});});});
  var opts=$('gw-others').innerHTML;
  function bind(r){
    var s=r.querySelector('.gw-t');s.innerHTML=opts;if(r.dataset.to)s.value=r.dataset.to;
    r.querySelector('.gw-x').addEventListener('click',function(){r.remove();});
  }
  box.querySelectorAll('.gw-rel').forEach(bind);
  if(!$('gw-others').options.length)$('gw-addrel').disabled=true;
  $('gw-addrel').addEventListener('click',function(){
    var r=document.createElement('div');r.className='gw-rel';r.dataset.to='';
    r.innerHTML=tr("ui.input_class_gw_in_gw_k_placeholder_e_g_owner_aria_label_relationship_type_select_class_gw_in_gw_t_ar");
    $('gw-rels').appendChild(r);bind(r);r.querySelector('.gw-k').focus();
  });
  $('f-name').addEventListener('input',function(){$('gw-save').disabled=!$('f-name').value.trim();});
  function lock(){box.querySelectorAll('input,select,textarea,button').forEach(function(x){x.disabled=true;});box.style.opacity='0.6';}
  $('gw-save').addEventListener('click',function(){
    var rel=[];box.querySelectorAll('.gw-rel').forEach(function(r){var k=r.querySelector('.gw-k').value.trim(),t=r.querySelector('.gw-t').value;if(k&&t)rel.push({to:t,kind:k});});
    var data={character_id:d.id,name:$('f-name').value.trim(),role:$('f-role').value,short:$('f-short').value.trim(),age:$('f-age').value.trim(),
      appearance:$('f-appearance').value.trim(),traits:$('f-traits').value.split(',').map(function(x){return x.trim();}).filter(Boolean),
      voice:$('f-voice').value.trim(),visual:$('f-visual').value.trim(),relations:rel,description:$('f-desc').value.trim(),notes:$('f-notes').value.trim()};
    if(d.source==='series'){data.series_id=d.series;lock();gwSend(tr("ui.character_2")+data.name+tr("ui.save_series_character_applies_to_every_volume"),'character.series.update',data);return;}
    lock();gwSend(tr("ui.character_2")+data.name+tr("ui.action_fragment_0"),'character.update',data);
  });
  // Serie (#116): passende Knöpfe je Herkunft
  var allow={series:['character.detach'],copy:['character.align','character.adopt'],copy_diff:['character.align','character.adopt'],own:['character.adopt']}[d.source]||[];
  box.querySelectorAll('.gw-sact').forEach(function(b){
    if(allow.indexOf(b.dataset.act)<0){b.remove();return;}
    b.addEventListener('click',function(){lock();gwSend(b.dataset.t+': „'+$('f-name').value.trim()+'“',b.dataset.act,{character_id:d.id});});
  });
  if(d.source==='series')$('gw-save').textContent=tr("ui.save_for_every_volume");
  $('gw-cancel').addEventListener('click',function(){lock();gwSend(tr("ui.changes_to_character_discarded"),'form.cancel',{form:'character.update',character_id:d.id});});
})();
</script>
