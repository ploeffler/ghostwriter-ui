<!--
  Vorlage: Kapitel bearbeiten (Formular, siehe templates/ui/README.md in GhostWriter)

  Inline-Widget für den Chat. Wird über den Symbol-Knopf "Kapitel bearbeiten"
  der Kapitelansicht geöffnet (Aktion chapter.edit.open).

  Aufbau:
  - Kopf: Stift-Symbol, "Kapitel N bearbeiten"
  - Titel (Pflichtfeld), Untertitel, Kurzbeschreibung, Ziel des Kapitels
  - Abbrechen und Speichern

  Platzhalter (Text wird von gw.js HTML-maskiert):
  - {{CHAPTER_ID}}        Kapitel-ID aus structure.chapters
  - {{CHAPTER_NUMBER}}    sichtbare Nummer
  - {{CHAPTER_TITLE}}     Titel
  - {{CHAPTER_SUBTITLE}}  erste kursive Zeile *…* der README.md des Kapitels, sonst leer
  - {{CHAPTER_SUMMARY}}   Text unter "## Kurzbeschreibung" der README.md; "Offen." gilt als leer
  - {{CHAPTER_GOAL}}      Text unter "## Ziel des Kapitels"; "Offen." gilt als leer

  Verhalten:
  - Speichern prüft, dass ein Titel eingegeben ist, und sendet alle Felder.
  - Abbrechen meldet nur den Abbruch. Danach ist das Formular gesperrt.

  Nachrichten: Klartextzeile plus Kurzform `gw:aktion schlüssel=wert` bzw. Block ```gw mit JSON, siehe BEFUELLUNG.md in GhostWriter.
  Aktionen: chapter.update {chapter_id, title, subtitle, summary, goal}, form.cancel

  Voraussetzungen der Darstellungsumgebung: CSS-Variablen des Hosts
  (--surface-*, --text-*, --border-*, --bg-*, --gap-*, --pad-*, --radius),
  Tabler-Icons (ti-*) und eine globale Funktion sendPrompt(text).
-->
<h2 class="sr-only">Formular zum Bearbeiten von Kapitel {{CHAPTER_NUMBER}}: Titel, Untertitel, Kurzbeschreibung und Ziel.</h2>
<style>
.gw-f label{display:block;font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
.gw-f .hint{font-size:12px;color:var(--text-muted);font-weight:400}
.gw-f input,.gw-f textarea,.gw-f select{width:100%;box-sizing:border-box;padding:9px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:14px}
.gw-f input:focus,.gw-f textarea:focus,.gw-f select:focus{outline:none;border-color:var(--border-accent)}
.gw-f textarea{resize:vertical;line-height:1.6}
.gw-err{font-size:13px;color:var(--text-danger);margin-top:4px}
.gw-btn{padding:9px 16px;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
</style>
<div style="padding:1rem 0">
  <form class="gw-f" id="gw-kapitel-bearbeiten" data-chapter="{{CHAPTER_ID}}" data-num="{{CHAPTER_NUMBER}}" novalidate style="border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);padding:var(--pad-lg);display:flex;flex-direction:column;gap:var(--gap-md)">
    <div style="display:flex;align-items:center;gap:var(--gap-sm)">
      <i class="ti ti-pencil" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i>
      <span style="font-size:16px;font-weight:500">Kapitel {{CHAPTER_NUMBER}} bearbeiten</span>
    </div>
    <div>
      <label for="gw-title">Titel</label>
      <input id="gw-title" value="{{CHAPTER_TITLE}}" placeholder="Titel des Kapitels">
      <div class="gw-err" id="gw-title-err" hidden>Bitte einen Titel eingeben.</div>
    </div>
    <div>
      <label for="gw-subtitle">Untertitel <span class="hint">optional</span></label>
      <input id="gw-subtitle" value="{{CHAPTER_SUBTITLE}}">
    </div>
    <div>
      <label for="gw-summary">Kurzbeschreibung <span class="hint">kurze Zusammenfassung des Kapitels</span></label>
      <textarea id="gw-summary" rows="2">{{CHAPTER_SUMMARY}}</textarea>
    </div>
    <div>
      <label for="gw-goal">Ziel des Kapitels <span class="hint">was soll der Leser danach verstanden haben?</span></label>
      <textarea id="gw-goal" rows="2">{{CHAPTER_GOAL}}</textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:var(--gap-sm);border-top:0.5px solid var(--border);padding-top:var(--pad-md)">
      <button type="button" class="gw-btn" id="gw-cancel" style="border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary)">Abbrechen</button>
      <button type="button" class="gw-btn" id="gw-save" style="border:0.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)">Speichern</button>
    </div>
  </form>
</div>
<script>
function gwSend(text,action,data){var d=data||{},k=Object.keys(d),short=k.every(function(x){var v=d[x];return typeof v==='number'||typeof v==='boolean'||(typeof v==='string'&&/^[^\s`]{1,80}$/.test(v));});sendPrompt(short?text+'\n\n`gw:'+action+k.map(function(x){return ' '+x+'='+d[x];}).join('')+'`':text+'\n\n```gw\n'+JSON.stringify(Object.assign({action:action},d))+'\n```');}
(function(){
  var f=document.getElementById('gw-kapitel-bearbeiten');
  var $=function(id){return document.getElementById(id);};
  var id=f.dataset.chapter,num=f.dataset.num;
  var title=$('gw-title'),err=$('gw-title-err');
  title.addEventListener('input',function(){err.hidden=true;});
  function lock(){f.querySelectorAll('input,textarea,button').forEach(function(x){x.disabled=true;});f.style.opacity='0.6';}
  $('gw-save').addEventListener('click',function(){
    if(!title.value.trim()){err.hidden=false;title.focus();return;}
    var g=function(k){return $(k).value.trim();};
    var d={chapter_id:id,title:g('gw-title'),subtitle:g('gw-subtitle'),summary:g('gw-summary'),goal:g('gw-goal')};
    lock();
    gwSend('Kapitel '+num+' speichern: '+d.title,'chapter.update',d);
  });
  $('gw-cancel').addEventListener('click',function(){lock();gwSend('Kapitel '+num+' bearbeiten abgebrochen','form.cancel',{form:'chapter.update',chapter_id:id});});
})();
</script>
