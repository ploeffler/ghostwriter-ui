<!--
  Vorlage: Projektdaten bearbeiten (Formular, siehe templates/ui/README.md)

  Inline-Widget für den Chat. Wird über den Symbol-Knopf "Projektdaten
  bearbeiten" der Projektübersicht geöffnet und enthält die Felder,
  die die Projektübersicht anzeigt.

  Aufbau:
  - Kopf: Stift-Symbol, Überschrift
  - Titel (Pflichtfeld)
  - Kurztitel und Autor nebeneinander
  - Kurzbeschreibung (ein Satz)
  - Beschreibung
  - Abbrechen und Speichern

  Platzhalter (vor der Ausgabe ersetzen; Text HTML-maskiert,
  unbekannte Werte leer lassen):
  - {{PROJECT_TITLE}}              project.title (bzw. working_title, solange kein Titel feststeht)
  - {{PROJECT_TITLE_SHORT}}        project.title_short
  - {{PROJECT_AUTHOR}}             project.author
  - {{PROJECT_DESCRIPTION_SHORT}}  project.description_short
  - {{PROJECT_DESCRIPTION}}        project.description

  Verhalten:
  - Speichern prüft, dass ein Titel eingegeben ist, und sendet sonst
    alle Felder als Nachricht in den Chat. Leere Felder werden als
    "(leer)" gesendet.
  - Abbrechen meldet nur den Abbruch. Danach ist das Formular gesperrt.

  Nachrichten: Klartextzeile plus Block ```gw mit JSON, siehe templates/ui/BEFUELLUNG.md.
  Aktionen: project.update {title, title_short, author, description_short, description}, form.cancel

  Voraussetzungen der Darstellungsumgebung: CSS-Variablen des Hosts
  (--surface-*, --text-*, --border-*, --bg-*, --gap-*, --pad-*, --radius),
  Tabler-Icons (ti-*) und eine globale Funktion sendPrompt(text).
-->
<h2 class="sr-only">Formular zum Bearbeiten der Projektdaten: Titel, Kurztitel, Autor, Kurzbeschreibung und Beschreibung.</h2>
<style>
.gw-f label{display:block;font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
.gw-f .hint{font-size:12px;color:var(--text-muted);font-weight:400}
.gw-f input,.gw-f textarea{width:100%;box-sizing:border-box;padding:9px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:14px}
.gw-f input:focus,.gw-f textarea:focus{outline:none;border-color:var(--border-accent)}
.gw-f textarea{resize:vertical;line-height:1.6}
.gw-err{font-size:13px;color:var(--text-danger);margin-top:4px}
.gw-btn{padding:9px 16px;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
</style>
<div style="padding:1rem 0">
  <form class="gw-f" id="gw-projektdaten" novalidate style="border:0.5px solid var(--border);border-radius:16px;background:var(--surface-1);padding:var(--pad-lg);display:flex;flex-direction:column;gap:var(--gap-md)">
    <div style="display:flex;align-items:center;gap:var(--gap-sm)">
      <i class="ti ti-edit" style="font-size:18px;color:var(--text-secondary)" aria-hidden="true"></i>
      <span style="font-size:16px;font-weight:500">Projektdaten bearbeiten</span>
    </div>
    <div>
      <label for="gw-title">Titel</label>
      <input id="gw-title" value="{{PROJECT_TITLE}}" placeholder="Titel des Buches">
      <div class="gw-err" id="gw-title-err" hidden>Bitte einen Titel eingeben.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--gap-md)">
      <div>
        <label for="gw-short">Kurztitel <span class="hint">für Badge und Listen</span></label>
        <input id="gw-short" maxlength="40" value="{{PROJECT_TITLE_SHORT}}">
      </div>
      <div>
        <label for="gw-author">Autor</label>
        <input id="gw-author" value="{{PROJECT_AUTHOR}}" placeholder="Name des Autors">
      </div>
    </div>
    <div>
      <label for="gw-dshort">Kurzbeschreibung <span class="hint">ein Satz</span></label>
      <input id="gw-dshort" value="{{PROJECT_DESCRIPTION_SHORT}}">
    </div>
    <div>
      <label for="gw-desc">Beschreibung</label>
      <textarea id="gw-desc" rows="5">{{PROJECT_DESCRIPTION}}</textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:var(--gap-sm);border-top:0.5px solid var(--border);padding-top:var(--pad-md)">
      <button type="button" class="gw-btn" id="gw-cancel" style="border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary)">Abbrechen</button>
      <button type="button" class="gw-btn" id="gw-save" style="border:0.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)">Speichern</button>
    </div>
  </form>
</div>
<script>
function gwSend(text,action,data){var p=Object.assign({action:action},data||{});sendPrompt(text+'\n\n```gw\n'+JSON.stringify(p)+'\n```');}
(function(){
  var f=document.getElementById('gw-projektdaten');
  var $=function(id){return document.getElementById(id);};
  var t=$('gw-title'),e=$('gw-title-err');
  t.addEventListener('input',function(){e.hidden=true;});
  function lock(){f.querySelectorAll('input,textarea,button').forEach(function(x){x.disabled=true;});f.style.opacity='0.6';}
  $('gw-save').addEventListener('click',function(){
    if(!t.value.trim()){e.hidden=false;t.focus();return;}
    var v=function(id){return $(id).value.trim()||'(leer)';};
    lock();
    var t=function(id){return $(id).value.trim();};
    gwSend('Projektdaten speichern: '+t('gw-title'),'project.update',{title:t('gw-title'),title_short:t('gw-short'),author:t('gw-author'),description_short:t('gw-dshort'),description:t('gw-desc')});
  });
  $('gw-cancel').addEventListener('click',function(){lock();gwSend('Projektdaten bearbeiten abgebrochen','form.cancel',{form:'project.update'});});
})();
</script>
